[build-system]
    build-backend = "poetry.core.masonry.api"
    requires = [
        "poetry-core>=1.9.0",
    ]

[project]
    classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Intended Audience :: Developers",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.13",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Topic :: System :: Systems Administration :: Authentication/Directory",
        "Typing :: Typed",
    ]
    dependencies = [
        "bcrypt>=4.3.0",
        "cryptography>=45.0.5",
        "pydantic-settings>=2.10.1",
        "pydantic (>=2.12.3)",
        "pyjwt>=2.9.0",
        "flext-core @ file:../flext-core",
        "flext-web @ file:../flext-web",
        "flext-api @ file:../flext-api",
        "pydantic-core (>=2.41.4)",
    ]
    description = "FLEXT Auth - Enterprise Authentication & Authorization Service"
    keywords = [
        "authentication",
        "authorization",
        "enterprise",
        "flext",
        "jwt",
        "security",
        "typed",
    ]
    name = "flext-auth"
    readme = "README.md"
    requires-python = ">=3.13,<3.14"
    version = "0.9.0"

    [[project.authors]]
        email = "team@flext.sh"
        name  = "FLEXT Team"

    [[project.maintainers]]
        email = "team@flext.sh"
        name  = "FLEXT Team"

    [project.license]
        text = "MIT"

    [project.urls]
        Documentation = "https://github.com/flext-sh/flext/blob/main/README.md"
        Homepage      = "https://github.com/flext-sh/flext"
        Repository    = "https://github.com/flext-sh/flext"

    [project.optional-dependencies]
        dev = [
            "autoflake>=2.3.1",
            "black>=25.1.0",
            "codespell>=2.3.0",
            "deptry>=0.23.0",
            "isort>=6.0.1",
            "pre-commit>=4.0.1",
            "pylint>=3.3.0",
            "pyupgrade>=3.19.0",
            "radon>=6.0.1",
            "ruff>=0.12.3",
            "vulture>=2.13",
        ]
        security = [
            "bandit>=1.8.0",
            "pip-audit>=2.7.3",
        ]
        test = [
            "factory-boy>=3.3.1",
            "faker>=37.4.0",
            "hypothesis>=6.125.0",
            "pytest-benchmark>=5.1.0",
            "pytest-clarity>=1.0.1",
            "pytest-cov>=6.2.0",
            "pytest-deadfixtures>=2.2.1",
            "pytest-env>=1.1.5",
            "pytest-httpx>=0.35.0",
            "pytest-mock>=3.14.0",
            "pytest-randomly>=3.16.0",
            "pytest-sugar>=1.0.0",
            "pytest-timeout>=2.4.0",
            "pytest-xdist>=3.8.0",
            "pytest>=8.4.0",
        ]
        typings = [
            "django-stubs>=5.2.2",
            "types-ldap3>=2.9.13.20250622",
            "types-passlib>=1.7.7",
            "types-protobuf>=6.30.2.20250703",
            "types-psutil>=7.0.0",
            "types-psycopg2>=2.9.21.20250718",
            "types-pyjwt>=1.7.1",
            "types-python-dateutil>=2.9.0",
            "types-pyyaml>=6.0.12",
            "types-redis>=4.6.0",
            "types-requests>=2.32.4",
            "types-setuptools>=80.9.0",
            "types-toml>=0.10.8.20240310",
        ]

    [project.scripts]
        flext-auth        = "flext_auth.cli_new:cli"
        flext-auth-legacy = "flext_auth.cli:main"

[tool]
    [tool.deptry]
        known_first_party = [
            "flext_auth",
        ]

    [tool.poetry]
        [[tool.poetry.packages]]
            from    = "src"
            include = "flext_auth"

        [tool.poetry.dependencies]
            python = ">=3.13,<3.14"

        [tool.poetry.dependencies.flext-core]
            develop = true
            path    = "../flext-core"

        [tool.poetry.dependencies.flext-observability]
            develop = true
            path    = "../flext-observability"

        [tool.poetry.group]
		    [tool.poetry.group.dev.dependencies]
		        commitizen     = ">=4.8.3"
		        detect-secrets = ">=1.5.0"
		        pyrefly        = "^0.34.0"

    [tool.pytest.ini_options]
        addopts = [
            "--cov-report=term-missing",
            "--cov=src/",
            "--strict-config",
            "--strict-markers",
            "--tb=short",
            "-p no:sugar",
            "-q",
            "-ra",
        ]
        markers = [
            "concurrency: marks tests as concurrency tests",
            "e2e: marks tests as end-to-end tests",
            "integration: marks tests as integration tests",
            "memory: marks tests as memory tests",
            "performance: marks tests as performance tests",
            "race_condition: marks tests as race condition tests",
            "regression: marks tests as regression tests",
            "slow: marks tests as slow (deselect with '-m \"not slow\"')",
            "smoke: marks tests as smoke tests",
            "timeout: marks tests as timeout tests",
            "unit: marks tests as unit tests",
        ]
        minversion = "8.0"
        python_classes = [
            "Test*",
        ]
        python_files = [
            "*_test.py",
            "test_*.py",
        ]
        python_functions = [
            "test_*",
        ]
        testpaths = [
            "tests",
        ]

    [tool.ruff]
        extend = "../ruff-shared.toml"

        [tool.ruff.lint.isort]
            known-first-party = [
                "flext_auth",
            ]
