[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.0", "poetry-core>=2" ]

[project]
name = "flext-auth"
version = "0.10.0-dev"
description = "FLEXT Auth - Enterprise Authentication & Authorization Service"
readme = "README.md"
keywords = [
  "authentication",
  "authorization",
  "enterprise",
  "flext",
  "jwt",
  "security",
  "typed",
]
license = "MIT"
maintainers = [ {email = "team@flext.sh", name = "FLEXT Team"} ]
authors = [ {email = "team@flext.sh", name = "FLEXT Team"} ]
requires-python = ">=3.13,<3.14"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
  "Development Status :: 5 - Production/Stable",
  "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = [
  "bcrypt>=4.3",
  "cryptography>=45.0.5",
  "pydantic>=2.12.3",
  "pydantic-core>=2.41.4",
  "pydantic-settings>=2.10.1",
  "pyjwt>=2.9",
]
optional-dependencies.dev = [
  "autoflake>=2.3.1",
  "black>=25.1",
  "codespell>=2.3",
  "deptry>=0.23",
  "isort>=6.0.1",
  "pre-commit>=4.0.1",
  "pylint>=3.3",
  "pyupgrade>=3.19",
  "radon>=6.0.1",
  "ruff>=0.12.3",
  "vulture>=2.13",
]
optional-dependencies.security = [
  "bandit>=1.8",
  "pip-audit>=2.7.3",
]
optional-dependencies.test = [
  "factory-boy>=3.3.1",
  "faker>=37.4",
  "hypothesis>=6.125",
  "pytest>=8.4",
  "pytest-benchmark>=5.1",
  "pytest-clarity>=1.0.1",
  "pytest-cov>=6.2",
  "pytest-deadfixtures>=2.2.1",
  "pytest-env>=1.1.5",
  "pytest-httpx>=0.35",
  "pytest-mock>=3.14",
  "pytest-randomly>=3.16",
  "pytest-sugar>=1",
  "pytest-timeout>=2.4",
  "pytest-xdist>=3.8",
]
optional-dependencies.typings = [
  "django-stubs>=5.2.2",
  "types-ldap3>=2.9.13.20250622",
  "types-passlib>=1.7.7",
  "types-protobuf>=6.30.2.20250703",
  "types-psutil>=7",
  "types-psycopg2>=2.9.21.20250718",
  "types-pyjwt>=1.7.1",
  "types-python-dateutil>=2.9",
  "types-pyyaml>=6.0.12",
  "types-redis>=4.6",
  "types-requests>=2.32.4",
  "types-setuptools>=80.9",
  "types-toml>=0.10.8.20240310",
]
urls.Documentation = "https://github.com/flext-sh/flext/blob/main/README.md"
urls.Homepage = "https://github.com/flext-sh/flext"
scripts.flext-auth = "flext_auth.cli_new:cli"
scripts.flext-auth-legacy = "flext_auth.cli:main"

[tool]
[tool.poetry]
dependencies.python = ">=3.13,<3.14"
dependencies.flext-core.develop = true
dependencies.flext-core.path = ".flext-deps/flext-core"
dependencies.flext-observability.develop = true
dependencies.flext-observability.path = ".flext-deps/flext-observability"
dependencies.flext-quality.develop = true
dependencies.flext-quality.optional = true
dependencies.flext-quality.path = ".flext-deps/flext-quality"
group.dev.dependencies.commitizen = ">=4.8.3"
group.dev.dependencies.detect-secrets = ">=1.5.0"
group.dev.dependencies.pyrefly = "^0.46.3"
group.dev.dependencies.pytest = "^9.0.2"
group.dev.dependencies.pytest-httpx = "^0.36.0"
group.dev.dependencies.opentelemetry-api = ">=1.39.1"
group.dev.dependencies.opentelemetry-sdk = ">=1.39.1"
group.dev.dependencies.prompt-toolkit = ">=3.0.52"
group.dev.dependencies.sqlparse = ">=0.5.5"
packages = [ {from = "src", include = "flext_auth"} ]

[tool.ruff]
exclude = [ "scripts/" ]       # Exclude maintenance scripts from lint
extend = "../ruff-shared.toml"

[tool.deptry]
known_first_party = [
  "flext_auth",
  "flext_core",
  "flext_observability",
]
pep621_dev_dependency_groups = [
  "dev",
  "test",
  "typings",
  "security",
]
per_rule_ignores.DEP002 = [
  # CLI tools (invoked from command line, not imported)
  # Type stubs
  # Runtime deps used indirectly (via pydantic, flext-core)
  "autoflake",
  "bandit",
  "black",
  "codespell",
  "commitizen",
  "deptry",
  "detect-secrets",
  "isort",
  "pip-audit",
  "pre-commit",
  "pylint",
  "pyrefly",
  "pyupgrade",
  "radon",
  "ruff",
  "vulture",
  "django-stubs",
  "types-ldap3",
  "types-passlib",
  "types-protobuf",
  "types-psutil",
  "types-psycopg2",
  "types-pyjwt",
  "types-python-dateutil",
  "types-pyyaml",
  "types-redis",
  "types-requests",
  "types-setuptools",
  "types-toml",
  "pydantic-core",
]

[tool.pytest]
ini_options.addopts = [
  "--strict-config",
  "--strict-markers",
  "--tb=short",
  "-p no:sugar",
  "-q",
  "-ra",
  "--timeout=30",
  "--timeout-method=signal",
  "--durations=0",
]
ini_options.markers = [
  "concurrency: marks tests as concurrency tests",
  "e2e: marks tests as end-to-end tests",
  "integration: marks tests as integration tests",
  "memory: marks tests as memory tests",
  "performance: marks tests as performance tests",
  "race_condition: marks tests as race condition tests",
  "regression: marks tests as regression tests",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "smoke: marks tests as smoke tests",
  "timeout: marks tests as timeout tests",
  "unit: marks tests as unit tests",
]
ini_options.minversion = "8.0"
ini_options.python_classes = [
  "Test*",
]
ini_options.python_files = [
  "*_test.py",
  "test_*.py",
]
ini_options.python_functions = [
  "test_*",
]
ini_options.testpaths = [
  "tests",
]

[tool.coverage]
report.fail_under = 100
report.precision = 2
run.source = [ "src/flext_auth" ]

[tool.pyrefly]
project-excludes = [ "**/*_pb2*.py", "**/*_pb2_grpc*.py" ]
search-path = [
  "../typings",
  "../typings/generated",
  "src",
  "tests",
  "examples",
  "scripts",
]

[tool.bandit]
skips = [ "B404", "B603", "B607", "B105", "B608" ]
