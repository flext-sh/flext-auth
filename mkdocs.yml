site_name: FLEXT Auth Documentation
site_description: Authentication library docs
site_url: https://github.com/flext-sh/flext
repo_name: flext-sh/flext
repo_url: https://github.com/flext-sh/flext
edit_uri: edit/main/flext-auth/docs/
docs_dir: docs
site_dir: .reports/docs/site
exclude_docs: README.md

theme:
  name: material

plugins: []

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Development: development.md
  - API Reference: api-reference.md
  - Architecture: architecture.md
  - Troubleshooting: troubleshooting.md

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore
